name: Weekly scholarship post draft

# Every week, searches for currently-open scholarships and drafts a new
# blog post about them, then opens a pull request for human review.
# Nothing goes live automatically — merging the PR is the "publish"
# step, and merging triggers rebuild-blog-index.yml to update the blog
# archive and sitemap automatically.
#
# Setup required (one-time):
#   1. Repo Settings -> Secrets and variables -> Actions -> New repository
#      secret named ANTHROPIC_API_KEY, with a key from console.anthropic.com.
#   2. Repo Settings -> Actions -> General -> Workflow permissions ->
#      set to "Read and write permissions" so this workflow can push a
#      branch and open a PR.
#
# To test it immediately instead of waiting for the schedule, go to the
# Actions tab, select "Weekly scholarship post draft", and click
# "Run workflow".
on:
  schedule:
    # Every Monday at 08:00 UTC. Adjust as you like.
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate scholarship post draft
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/generate_scholarship_post.py

      - name: Rebuild blog index locally (so the PR diff already includes it)
        run: python3 scripts/build_blog_index.py

      - name: Open pull request for review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "content: draft weekly scholarship post (${{ steps.generate.outputs.slug }})"
          branch: "auto/scholarship-post-${{ steps.generate.outputs.slug }}"
          title: "[Review needed] New scholarship post: ${{ steps.generate.outputs.title }}"
          body: |
            This post was drafted automatically by the weekly scholarship
            research pipeline. **Before merging**, please:

            - Open the new `${{ steps.generate.outputs.slug }}.html` file in
              the "Files changed" tab and read it.
            - Click through to the official source link(s) cited in the post
              and confirm the deadline, eligibility, and application link are
              correct and current.
            - Check the post reads naturally and matches the site's tone.

            Merging this PR publishes the post — the blog archive and
            sitemap will update automatically once merged.
          labels: |
            auto-generated
            needs-review
