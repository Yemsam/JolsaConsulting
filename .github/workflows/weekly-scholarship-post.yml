name: Weekly scholarship listing draft

on:
  schedule:
    - cron: "0 8 * * 1" # Monday, 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-scholarship-discovery
  cancel-in-progress: false

jobs:
  draft-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test collector
        run: node --test scripts/collect-scholarships.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test reviewed draft publishing
        run: python -m unittest discover -s scripts -p "test_publish_scholarship_draft.py"
      - name: Collect Scholarship Region leads and check official sources
        id: generate
        env:
          SCHOLARSHIP_POST_BATCH_SIZE: "5"
          SCHOLARSHIP_MAX_ARTICLES: "20"
        run: node scripts/collect-scholarships.mjs
      - name: Preserve report, including source failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scholarship-discovery-${{ github.run_id }}
          path: automation/
          if-no-files-found: ignore
          retention-days: 30
      - name: Open review pull request
        if: steps.generate.outputs.count != '0' && steps.generate.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: "auto/scholarship-listing-${{ github.run_id }}"
          add-paths: automation/
          commit-message: "content: collect scholarship opportunities for review"
          title: "[Review needed] ${{ steps.generate.outputs.count }} scholarship opportunity draft(s)"
          body: |
            Discovery source: **Scholarship Region only**. No paid AI API is used.

            See `automation/latest-report.md` and new files under
            `automation/drafts/`. Official-source links were followed where
            permitted; a retrieved link is not proof of provider identity.

            Check provider identity, application cycle, eligibility, funding,
            and deadline. Complete each companion JSON and follow
            `automation/README.md` to promote reviewed drafts to website pages.

            Merging this discovery batch alone does not publish listings.
            Source failures appear in the Actions summary and artifact.
          labels: |
            auto-generated
            needs-review
