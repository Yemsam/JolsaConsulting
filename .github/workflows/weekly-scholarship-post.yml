name: Weekly scholarship listing draft

# Every week, searches for up to 5 currently-open (or opening-soon)
# scholarships and drafts new entries for the Scholarships hub
# (scholarships.html), then opens ONE pull request covering the whole
# batch for human review. Nothing goes live automatically — merging the
# PR is the "publish" step, and merging triggers
# rebuild-scholarships-index.yml to update the Scholarships hub and
# sitemap automatically.
#
# Quality still comes before quantity: the research script is instructed
# to return fewer than 5 (even just one) rather than pad the batch with
# weak or unverifiable entries. Adjust the target count via the
# SCHOLARSHIP_POST_BATCH_SIZE env var below if you want a different pace.
#
# Setup required (one-time):
#   1. Repo Settings -> Secrets and variables -> Actions -> New repository
#      secret named ANTHROPIC_API_KEY, with a key from console.anthropic.com.
#   2. Repo Settings -> Actions -> General -> Workflow permissions ->
#      set to "Read and write permissions", AND check "Allow GitHub
#      Actions to create and approve pull requests" (separate checkbox
#      just below it) so this workflow can push a branch and open a PR.
#
# To test it immediately instead of waiting for the schedule, go to the
# Actions tab, select "Weekly scholarship listing draft", and click
# "Run workflow".
on:
  schedule:
    # Every Monday at 08:00 UTC. Adjust as you like.
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate scholarship listing draft batch
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCHOLARSHIP_POST_BATCH_SIZE: "5"
        run: python3 scripts/generate_scholarship_post.py

      - name: Rebuild scholarships hub locally (so the PR diff already includes it)
        run: python3 scripts/build_scholarships_index.py

      - name: Open pull request for review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "content: draft weekly scholarship listings (${{ steps.generate.outputs.count }})"
          branch: "auto/scholarship-listing-${{ github.run_id }}"
          title: "[Review needed] ${{ steps.generate.outputs.count }} new scholarship listing(s): ${{ steps.generate.outputs.title }} + more"
          body: |
            This batch of scholarship listings was drafted automatically by
            the weekly research pipeline. **Before merging**, please review
            EVERY entry below — each one needs its own check:

            ${{ steps.generate.outputs.summary }}

            For each entry:
            - Open its `scholarship-<slug>.html` file and its entry in
              `scholarships.json` in the "Files changed" tab and read them.
            - Click through to the official source link cited and confirm
              the deadline, eligibility, and application link are correct
              and current.
            - Check the level/country filters and status are set correctly,
              and that the page reads clearly and matches the site's tone.

            Merging this PR publishes every entry in the batch at once — the
            Scholarships hub (scholarships.html) and sitemap will update
            automatically once merged. If only some entries check out,
            remove the others from `scholarships.json` and delete their
            `scholarship-<slug>.html` file in this PR before merging.
          labels: |
            auto-generated
            needs-review
